<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Details - MoneyFast</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="header">
        <div class="header-content">
            <a href="/dashboard.html" class="logo" style="text-decoration: none;">MoneyFast Uganda</a>
            <div class="user-info">
                <span id="user-name">Loading...</span>
                <button class="btn btn-danger" onclick="logout()" style="padding: 0.5rem 1rem;">Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="flex-between mb-2">
            <h1>Batch Details</h1>
            <a href="/dashboard.html" class="btn btn-outline">← Back</a>
        </div>

        <div id="loading" class="text-center">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>

        <div id="content" class="hidden">
            <!-- Batch Summary Card -->
            <div class="card">
                <div class="flex-between mb-1">
                    <h2 class="card-title" style="margin-bottom: 0;" id="batch-reference">Batch</h2>
                    <div style="display: flex; gap: 0.5rem;">
                        <a id="download-report-btn" class="btn btn-outline" style="text-decoration: none;">📥 Download
                            Report</a>
                        <button class="btn btn-secondary" onclick="loadBatch()">🔄 Refresh</button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Amount</div>
                        <div class="stat-value" id="total-amount">0 UGX</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Items</div>
                        <div class="stat-value" id="total-items">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Successful</div>
                        <div class="stat-value" style="color: var(--secondary-color);" id="success-count">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Failed</div>
                        <div class="stat-value" style="color: var(--danger-color);" id="failed-count">0</div>
                    </div>
                </div>

                <div class="flex-between">
                    <div>
                        <strong>Status:</strong> <span id="batch-status"></span>
                    </div>
                    <div>
                        <strong>Created:</strong> <span id="created-at"></span>
                    </div>
                </div>
            </div>

            <!-- Items Table -->
            <div class="card">
                <h2 class="card-title">Transactions</h2>

                <div style="margin-bottom: 1rem;">
                    <label>Filter:</label>
                    <select id="filter-status" class="form-select"
                        style="width: auto; display: inline-block; margin-left: 0.5rem;" onchange="filterItems()">
                        <option value="">All</option>
                        <option value="PENDING">Pending</option>
                        <option value="PROCESSING">Processing</option>
                        <option value="SUCCESS">Successful</option>
                        <option value="FAILED">Failed</option>
                    </select>
                </div>

                <table class="table">
                    <thead>
                        <tr>
                            <th>Phone</th>
                            <th>Network</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Error Message</th>
                            <th>TX ID</th>
                        </tr>
                    </thead>
                    <tbody id="items-tbody">
                        <!-- Items will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        checkAuth();

        const urlParams = new URLSearchParams(window.location.search);
        const batchId = urlParams.get('id');

        if (!batchId) {
            window.location.href = '/dashboard.html';
        }

        let allItems = [];

        loadBatch();

        // Auto-refresh every 5 seconds
        setInterval(() => {
            loadBatch(true); // true = silent refresh (no spinner)
        }, 5000);

        async function loadBatch(silent = false) {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');

            try {
                if (!silent) {
                    loading.classList.remove('hidden');
                    content.classList.add('hidden');
                }

                const batch = await apiRequest(`/api/batches/${batchId}`);

                // Update summary
                document.getElementById('batch-reference').textContent = batch.batch.reference;
                document.getElementById('total-amount').textContent = formatMoney(batch.batch.total_amount) + ' UGX';
                document.getElementById('total-items').textContent = batch.batch.total_items;
                document.getElementById('success-count').textContent = batch.batch.success_count || 0;
                document.getElementById('failed-count').textContent = batch.batch.failed_count || 0;
                document.getElementById('batch-status').innerHTML = getStatusBadge(batch.batch.status);
                document.getElementById('created-at').textContent = formatDate(batch.batch.created_at);

                // Update download link
                const downloadBtn = document.getElementById('download-report-btn');
                downloadBtn.href = `/api/batches/${batchId}/export?token=${localStorage.getItem('token')}`; // Standard link, but we might need to handle auth token differently for direct links

                // Store items
                allItems = batch.batch.items;

                // Display items
                filterItems();

                content.classList.remove('hidden');
            } catch (error) {
                alert('Error loading batch: ' + error.message);
                window.location.href = '/dashboard.html';
            } finally {
                loading.classList.add('hidden');
            }
        }

        function filterItems() {
            const filterStatus = document.getElementById('filter-status').value;
            const tbody = document.getElementById('items-tbody');

            const filtered = filterStatus
                ? allItems.filter(item => item.status === filterStatus)
                : allItems;

            tbody.innerHTML = filtered.map(item => `
        <tr>
          <td>${item.phone_number}</td>
          <td><strong>${item.provider}</strong></td>
          <td>${formatMoney(item.amount)} UGX</td>
          <td>${getItemStatusBadge(item.status)}</td>
          <td style="font-size: 0.875rem; color: var(--text-secondary);">
            ${item.error_message || '-'}
          </td>
          <td style="font-size: 0.75rem; color: var(--text-secondary);">
            ${item.operator_tx_id || '-'}
          </td>
        </tr>
      `).join('');
        }

        function getStatusBadge(status) {
            const badges = {
                'NEW': '<span class="badge badge-pending">New</span>',
                'PROCESSING': '<span class="badge badge-processing">Processing</span>',
                'DONE': '<span class="badge badge-success">Completed</span>',
                'PARTIAL': '<span class="badge badge-warning">Partial</span>',
                'FAILED': '<span class="badge badge-failed">Failed</span>',
            };
            return badges[status] || status;
        }

        function getItemStatusBadge(status) {
            const badges = {
                'PENDING': '<span class="badge badge-pending">Pending</span>',
                'PROCESSING': '<span class="badge badge-processing">Processing</span>',
                'SUCCESS': '<span class="badge badge-success">Successful</span>',
                'FAILED': '<span class="badge badge-failed">Failed</span>',
            };
            return badges[status] || status;
        }
    </script>
</body>

</html>
