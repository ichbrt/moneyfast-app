<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Batch - MoneyFast Uganda</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/logo.png">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">MoneyFast Uganda</div>
            <div class="user-info">
                <a href="/dashboard.html" class="btn btn-outline" style="padding: 0.5rem 1rem; font-size: 0.875rem;">
                    ← Back to Dashboard
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <h1 class="card-title">Create New Batch</h1>

            <div id="error-message" class="alert alert-error hidden"></div>
            <div id="success-message" class="alert alert-success hidden"></div>

            <form id="upload-form">
                <div class="form-group">
                    <label class="form-label" for="reference">Batch Reference</label>
                    <input type="text" id="reference" class="form-input"
                        placeholder="E.g.: December 2025 Salary Payments" required>
                </div>

                <div class="form-group">
                    <label class="form-label">CSV / Excel File</label>
                    <div class="upload-area" id="upload-area">
                        <p style="font-size: 3rem; margin-bottom: 0.5rem;">📄</p>
                        <p><strong>Click to select file</strong> or drag and drop here</p>
                        <p style="font-size: 0.875rem; color: var(--gray-500);">Maximum file size: 5MB</p>
                        <input type="file" id="file" accept=".csv, .xlsx, .xls" style="display: none;" required>
                    </div>
                    <div id="file-info" class="mt-1 hidden text-center">
                        <span class="badge badge-processing" id="file-name"></span>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label class="form-label">Download Templates</label>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <a href="/files/BulkPayment_Template_Blank.xlsx" class="btn btn-outline" download
                            style="font-size: 0.85rem;">
                            <i class="fas fa-download"></i> Excel Template (Blank)
                        </a>
                        <a href="/files/BulkPayment_Template_Sample.xlsx" class="btn btn-outline" download
                            style="font-size: 0.85rem;">
                            <i class="fas fa-file-excel"></i> Excel Sample
                        </a>
                        <a href="/files/BulkPayment_Template_Blank.csv" class="btn btn-outline" download
                            style="font-size: 0.85rem;">
                            <i class="fas fa-file-csv"></i> CSV Template (Blank)
                        </a>
                        <a href="/files/BulkPayment_Template_Sample.csv" class="btn btn-outline" download
                            style="font-size: 0.85rem;">
                            <i class="fas fa-file-alt"></i> CSV Sample
                        </a>
                    </div>
                </div>

                <div id="preview" class="hidden">
                    <h3 class="mb-1" style="font-size: 1.1rem;">Preview</h3>
                    <div id="preview-summary" class="alert alert-info mb-1"></div>
                    <div id="preview-errors" class="alert alert-error hidden mb-1"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn"
                    style="width: 100%; justify-content: center;">
                    Create Batch
                </button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Check authentication
        checkAuth();

        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file');
        const fileInfo = document.getElementById('file-info');
        const fileName = document.getElementById('file-name');

        // Click to select file
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect();
            }
        });

        // File selection
        fileInput.addEventListener('change', handleFileSelect);

        function handleFileSelect() {
            const file = fileInput.files[0];
            if (file) {
                fileName.textContent = file.name;
                fileInfo.classList.remove('hidden');
            }
        }

        // Form submission
        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const reference = document.getElementById('reference').value;
            const file = fileInput.files[0];

            if (!file) {
                showError('Please select a file');
                return;
            }

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; margin: 0; border-width: 2px;"></div> Processing...';

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('reference', reference);

                const response = await apiRequest('/api/batches/upload-csv', {
                    method: 'POST',
                    body: formData
                });

                showSuccess(`Batch created successfully! ${response.summary.validRows} payments added.`);

                setTimeout(() => {
                    window.location.href = `/batch-details.html?id=${response.batch.batchId}`;
                }, 1500);

            } catch (error) {
                let errorMessage = error.message;
                if (error.details && Array.isArray(error.details)) {
                    errorMessage += ':\n' + error.details.map(e => `• ${e}`).join('\n');
                }
                showError(errorMessage);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Batch';
            }
        });
    </script>
</body>

</html>
