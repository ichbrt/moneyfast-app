<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MoneyFast Uganda</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/assets/logo.png">
</head>

<body class="login-page">
  <div class="container">
    <div class="card">
      <div class="text-center mb-2">
        <img src="/assets/logo.png" alt="MoneyFast Uganda"
          style="max-width: 280px; margin: 0 auto 1rem; display: block;">
        <p class="text-secondary" style="margin-top: 0.5rem;">Uganda Mobile Money Automation</p>
        <a href="/index.html" style="font-size: 0.8rem; text-decoration: none; color: var(--primary);">← Back to
          Home</a>
      </div>

      <div id="error-message" class="alert alert-error hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="admin@smsconstruction.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
          Login to Dashboard
        </button>
      </form>

      <div class="mt-2 text-center"
        style="font-size: 0.875rem; color: var(--text-secondary); background: #f9fafb; padding: 1rem; border-radius: 0.5rem;">
        <p style="margin-bottom: 0.5rem;"><strong>Demo Credentials:</strong></p>
        <p>User: <code>admin@smsconstruction.com</code></p>
        <p>Pass: <code>admin123</code></p>
      </div>
    </div>
  </div>

  <script>
    // Check if already logged in
    const token = localStorage.getItem('token');
    if (token) {
      window.location.href = '/dashboard.html';
    }

    // Handle login form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok) {
          // Save token and user info
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));

          // Redirect to dashboard
          window.location.href = '/dashboard.html';
        } else {
          errorDiv.textContent = data.error || 'Login failed';
          errorDiv.classList.remove('hidden');
        }
      } catch (error) {
        errorDiv.textContent = 'Connection error. Please try again.';
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>

</html>
